name: Sync tracker

# Copies jobs you ticked "Applied" on the Jobs tab into the Applications tab.
# Runs every morning; use "Run workflow" for an immediate sync (also re-applies sheet formatting).
on:
  schedule:
    - cron: "17 13 * * *"     # daily 13:17 UTC = 8:17am Central (standard time)
  workflow_dispatch:
    inputs:
      setup:
        description: "Re-create tabs, dropdowns and dashboard"
        type: boolean
        default: false

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python -m jobwatch sync ${{ inputs.setup && '--setup' || '' }}
