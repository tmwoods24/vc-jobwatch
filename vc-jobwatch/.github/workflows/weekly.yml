name: Weekly job watch

on:
  schedule:
    # Mondays 11:43 UTC = 6:43am Central / 7:43am Eastern (standard time).
    # GitHub cron is UTC-only and can run a few minutes late.
    - cron: "43 11 * * 1"
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      report_all:
        description: "Report every current match, not just new ones"
        type: boolean
        default: false

permissions:
  contents: write           # lets the run commit data/seen.json and the report back

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, score and email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m jobwatch run ${{ inputs.report_all && '--all' || '' }}

      - name: Save what we've seen
        if: always()
        run: |
          git config user.name "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          git add data/seen.json reports/
          git diff --cached --quiet || git commit -m "Weekly job watch $(date -u +%F)"
          git push
