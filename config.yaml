# ---------------------------------------------------------------------------
# vc-jobwatch configuration
# Edit this file to add boards, tune filters, or change the report.
# ---------------------------------------------------------------------------

# Where you want to work. A job passes if ANY of its locations matches one of
# these patterns (case-insensitive regex), or if it is remote and remote is allowed.
locations:
  include:
    - '\bnew york\b'
    - '\bnyc\b'
    - '\bmanhattan\b'
    - '\bbrooklyn\b'
  allow_remote: true          # remote roles open to US / NYC-based candidates
  remote_exclude:             # ...but not remote roles pinned to another country
    - 'canada|united kingdom|\buk\b|london|europe|emea|india|brazil|latam|latin america|apac|asia|australia|germany|france|spain|poland|israel|mexico|philippines|argentina|singapore|japan'
    - 'switzerland|lausanne|zurich|netherlands|amsterdam|ireland|dublin|sweden|portugal|italy|denmark|norway|finland|belgium|austria|czech|romania|ukraine|colombia|chile|costa rica|nigeria|kenya|south africa|uae|dubai|hong kong|china|korea|taiwan|vietnam|indonesia|malaysia|thailand|new zealand'

# Title filters (case-insensitive regex). A job must match at least one
# `include` pattern and none of the `exclude` patterns.
titles:
  include:
    - 'chief of staff'
    - "founder'?s associate|founders associate|founding associate"
    - 'strategic finance|fp&a|financial planning|corporate development|corp dev'
    - 'biz ?ops|business operations|strategy (&|and) operations|strategy & ops|strategic operations|strategy and ops'
    - '\bstrategy\b'
    - 'special projects|office of the (ceo|founder|president|cfo)'
    - 'head of (finance|operations|strategy|business)'
    - 'investor relations|capital markets|fundrais|project finance|structured finance|capital formation'
    - '\bventure\b|\bvc\b|\binvestment|investor|principal\b|\bplatform\b.*(venture|investment)'
    - 'business development|partnerships|commercial strategy'
    - '\baccelerator\b|\bincubator\b|ecosystem'
    - '\bgeneral manager\b|\bgm\b'
    - 'finance (manager|lead|director)|director,? (of )?finance|vp,? finance'
  # Core targets: kept even if they also hit an `exclude` word (e.g. "Chief of Staff, Clinical"),
  # unless they hit `hard_exclude`.
  always_include:
    - 'chief of staff'
    - "founder'?s associate|founders associate"
    - 'strategic finance'
    - '\bventure (associate|investor|partner|fellow)|investment (associate|analyst|manager)'
    - '\bvc\b'                      # any "VC ..." role (Venture5 titles), unless hard-excluded
  hard_exclude:
    - 'intern\b|internship|co-?op\b|executive assistant'
  exclude:
    - 'engineer|engineering|developer|scientist|technician|machinist|designer|architect\b'
    - 'account executive|sales (development|representative)|\bsdr\b|\bbdr\b|account manager|customer success|support'
    - 'recruit|talent acquisition|people partner|\bhr\b'
    - 'intern\b|internship|co-?op\b'
    - 'accountant|accounts payable|accounts receivable|payroll|bookkeep|\btax\b|controller|audit'
    - 'nurse|clinical|pharmac|physician|medical assistant|therap'
    - 'warehouse|driver|(machine|equipment|plant) operator|shift|\bstore\b|retail|restaurant|barista'
    - 'marketing|content|social media|brand|\bpr\b|communications'
    - 'counsel|paralegal|legal'
    - 'security|devops|\bit\b|data (analyst|engineer)'

# Claude fit scoring. Needs the ANTHROPIC_API_KEY env var (a GitHub secret).
scoring:
  enabled: true
  model: claude-sonnet-5-5
  profile_file: profile.md      # your background + what you want (edit this!)
  batch_size: 20
  max_jobs: 400                 # safety cap on how many new jobs get scored per run
  min_score_in_report: 4        # jobs scored below this go in a collapsed "low fit" list

report:
  output_dir: reports
  title: "Weekly NYC role watch"

# First run only: report jobs posted on/after this date. Later runs report whatever is new each week.
first_run_since: 2026-10-01

# How long to remember a job ID after we last saw it (days).
seen_retention_days: 180

# Seconds to wait between API requests to the same board. Be polite.
request_delay: 1.0

# ---------------------------------------------------------------------------
# Sources
#   getro:       domain only. The board's numeric network ID is read from the page.
#   consider:    domain + board_id. `api_domain` lets a board whose own site is
#                not a Consider front-end (a16z) be read through Consider's API.
#   lowercarbon: Lowercarbon's WordPress JSON feed.
#   traction:    tractionjobs.com aggregate (all VC-backed startups, tagged by fund).
# `group` controls the report section: "vc" boards vs the broad "aggregator".
# ---------------------------------------------------------------------------
sources:
  # --- Generalist NYC-heavy funds
  - {name: Union Square Ventures, type: consider, domain: jobs.usv.com, board_id: union-square-ventures, group: vc}
  - {name: FirstMark,             type: getro,    domain: jobs.firstmark.com, group: vc}
  - {name: Lerer Hippeau,         type: getro,    domain: jobs.lererhippeau.com, group: vc}
  - {name: Greycroft,             type: getro,    domain: jobs.greycroft.com, group: vc}
  - {name: Primary,               type: getro,    domain: jobs.primary.vc, group: vc}
  - {name: Insight Partners,      type: getro,    domain: jobs.insightpartners.com, group: vc}
  - {name: Thrive Capital,        type: getro,    domain: jobs.thrivecap.com, group: vc}
  - {name: General Catalyst,      type: getro,    domain: jobs.generalcatalyst.com, group: vc}
  - {name: a16z,                  type: consider, domain: jobs.a16z.com, api_domain: jobs.usv.com, board_id: andreessen-horowitz, group: vc}
  - {name: Khosla Ventures,       type: getro,    domain: jobs.khoslaventures.com, group: vc}
  - {name: Promus Ventures,       type: consider, domain: jobs.promusventures.com, board_id: promus-ventures, group: vc}

  # --- Climate / hardware / deep tech
  - {name: Energy Impact Partners,     type: getro,    domain: jobs.energyimpactpartners.com, group: vc}
  - {name: Lowercarbon,                type: lowercarbon, domain: lowercarbon.com, group: vc}
  - {name: Lux Capital,                type: getro,    domain: jobs.luxcapital.com, group: vc}
  - {name: Breakthrough Energy Ventures, type: getro,  domain: bevjobs.breakthroughenergy.org, group: vc}
  - {name: The Engine,                 type: getro,    domain: jobs.engine.xyz, group: vc}
  - {name: Prelude Ventures,           type: getro,    domain: jobs.preludeventures.com, group: vc}

  # --- Roles AT venture firms (not portfolio companies). Listings stay up for months, so only
  #     jobs posted in the last `max_age_days` are considered.
  - {name: Venture5, type: wpjobmanager, domain: venture5.com, max_age_days: 30, group: vc}

  # --- Broad aggregator (all VC-backed startups). Categories: ops, leadership, sales, tech, autre
  - {name: Traction, type: traction, domain: tractionjobs.com, categories: [ops, leadership], group: aggregator}
